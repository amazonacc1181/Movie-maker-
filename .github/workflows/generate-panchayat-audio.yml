name: Generate legacy Edge TTS draft (manual only)
concurrency:
  group: panchayat-audio-build
  cancel-in-progress: false
# Manual-only legacy fallback. Use the ElevenLabs studio for expressive narration.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate Hindi neural narration
        run: |
          python generate_edge_audio.py --input scripts/panchayat-season-5-short-hinglish.txt --output audio/Panchayat_Season_5_Expressive_3min.mp3 --voice hi-IN-MadhurNeural --rate=+10%
      - name: Upload MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: panchayat-season5-expressive-3min
          path: audio/Panchayat_Season_5_Expressive_3min.mp3
          if-no-files-found: error
          retention-days: 30

      - name: Commit MP3 into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/Panchayat_Season_5_Expressive_3min.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Panchayat Season 5 short expressive narration MP3"
            git pull --rebase origin main
            git push
          fi
