name: Build Class 11 Maths Lecture Metadata PDF

on:
  push:
    branches: [main]
    paths:
      - "maths11-lecture-report/**"
      - ".github/workflows/class11-maths-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp reportlab

      - name: Extract all 20 lecture metadata and create report
        run: python maths11-lecture-report/build_report.py

      - name: Upload PDF, CSV and JSON report
        uses: actions/upload-artifact@v4
        with:
          name: class11-maths-lecture-metadata
          path: maths11-lecture-report/output/*
          if-no-files-found: error
          retention-days: 30
